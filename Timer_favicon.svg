  <rect width="64" height="64" rx="13" fill="#0B1730"/>

  <!-- Stopwatch top button -->
  <rect x="27" y="7" width="10" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="30" y="10" width="4" height="7" rx="2" fill="#FFFFFF"/>

  <!-- Side button -->
