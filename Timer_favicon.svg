  <!-- Hands -->
  <path d="M32 36 L32 24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 36 L40 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="2.5" fill="#FFFFFF"/>
